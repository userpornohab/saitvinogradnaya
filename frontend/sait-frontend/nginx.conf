map $request_uri $robots_header {
    default "";
    ~^/(admin(?:/|\?|$)|login(?:/|\?|$)|account(?:/|\?|$)) "noindex, nofollow";
}

server {
    listen 80;
    server_name vinegrape.ru;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag $robots_header always;
        try_files $uri =404;
    }

    # The backend inserts metadata into this same build's /index.html.
    location = / {
        proxy_pass http://backend:8000/public-pages/;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }

    location ^~ /rooms/ {
        proxy_pass http://backend:8000/public-pages/rooms/;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }

    location ~ ^/room=([0-9]+)$ {
        rewrite ^/room=([0-9]+)$ /public-pages/room=$1 break;
        proxy_pass http://backend:8000;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/public-pages/sitemap.xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
